name: Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'CHANGELOG.md'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.1.0). Leave empty to use latest version from CHANGELOG.md'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create as prerelease'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Auto-Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and determine if release is needed
        id: check_version
        shell: pwsh
        run: |
          $tag = ""
          $shouldRelease = $false

          if ($env:GITHUB_REF_TYPE -eq "tag") {
              $tag = $env:GITHUB_REF_NAME.Trim()
              $shouldRelease = $true
              Write-Host "Triggered by tag push: $tag"
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and "${{ inputs.tag_name }}") {
              $tag = "${{ inputs.tag_name }}".Trim()
              $shouldRelease = $true
              Write-Host "Triggered manually for tag: $tag"
          } else {
              # Check CHANGELOG.md for the latest version
              if (Test-Path CHANGELOG.md) {
                  $changelog = Get-Content CHANGELOG.md -Raw
                  if ($changelog -match '(?m)^##\s+\[(?<ver>[0-9]+\.[0-9]+(\.[0-9]+)?.*?)\]') {
                      $ver = $Matches['ver'].Trim()
                      $tag = if ($ver.StartsWith('v')) { $ver } else { "v$ver" }
                      
                      git fetch --tags --force
                      $existingTag = git tag -l $tag
                      if (-not $existingTag) {
                          Write-Host "New version detected in CHANGELOG.md: $tag (tag does not exist yet)"
                          $shouldRelease = $true
                      } else {
                          Write-Host "Version $tag in CHANGELOG.md already has tag $existingTag. Skipping release."
                          $shouldRelease = $false
                      }
                  } else {
                      Write-Host "No version header found in CHANGELOG.md."
                  }
              }
          }

          if ($shouldRelease -and -not $tag) {
              Write-Error "Release was requested but no tag could be determined."
              exit 1
          }

          $isPrerelease = "${{ inputs.prerelease }}" -eq "true" -or ($tag -match '-(alpha|beta|rc|preview)')
          
          "should_release=$shouldRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "title=Release $tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up MSVC environment
        if: steps.check_version.outputs.should_release == 'True' || steps.check_version.outputs.should_release == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build warp-sni-patcher
        if: steps.check_version.outputs.should_release == 'True' || steps.check_version.outputs.should_release == 'true'
        shell: cmd
        run: |
          build.bat -nopause

      - name: Verify build artifact
        if: steps.check_version.outputs.should_release == 'True' || steps.check_version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $exePath = "warp-sni-patcher.exe"
          if (-not (Test-Path $exePath)) {
              Write-Error "Expected build artifact '$exePath' was not found!"
              exit 1
          }
          $file = Get-Item $exePath
          Write-Host "Build verified: $($file.FullName) ($($file.Length) bytes)"
          if ($file.Length -lt 10000) {
              Write-Error "Generated executable is suspiciously small ($($file.Length) bytes)."
              exit 1
          }

      - name: Create release zip package (only exe)
        if: steps.check_version.outputs.should_release == 'True' || steps.check_version.outputs.should_release == 'true'
        id: pkg
        shell: pwsh
        run: |
          $tag = "${{ steps.check_version.outputs.tag }}"
          $zipName = "warp-sni-patcher-$tag.zip"
          Compress-Archive -Path "warp-sni-patcher.exe" -DestinationPath $zipName -Force
          Write-Host "Created archive: $zipName containing only warp-sni-patcher.exe"
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract Release Notes from CHANGELOG.md
        if: steps.check_version.outputs.should_release == 'True' || steps.check_version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $rawTag = "${{ steps.check_version.outputs.tag }}"
          $version = $rawTag -replace '^v',''
          $notesFile = "release_notes.md"
          
          if (Test-Path CHANGELOG.md) {
              $changelog = Get-Content CHANGELOG.md -Raw
              $escapedVer = [regex]::Escape($version)
              $pattern = "(?ms)## \[$escapedVer\][^\r\n]*\r?\n(.*?)(?=\r?\n(?:## \[|\[[^\]]+\]: )|\Z)"
              if ($changelog -match $pattern) {
                  $notes = $matches[1].Trim()
                  Set-Content -Path $notesFile -Value $notes -Encoding utf8
                  Write-Host "Extracted release notes for version $version:"
                  Write-Host $notes
              } else {
                  Write-Host "No matching section found in CHANGELOG.md for version $version"
                  Set-Content -Path $notesFile -Value "" -Encoding utf8
              }
          } else {
              Set-Content -Path $notesFile -Value "" -Encoding utf8
          }

      - name: Push Git Tag
        if: (steps.check_version.outputs.should_release == 'True' || steps.check_version.outputs.should_release == 'true') && github.ref_type != 'tag'
        shell: pwsh
        run: |
          $tag = "${{ steps.check_version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Release $tag"
          git push origin $tag
          Write-Host "Pushed tag $tag to origin"

      - name: Publish GitHub Release
        if: steps.check_version.outputs.should_release == 'True' || steps.check_version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: ${{ steps.check_version.outputs.title }}
          body_path: release_notes.md
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ steps.check_version.outputs.is_prerelease == 'True' || steps.check_version.outputs.is_prerelease == 'true' }}
          files: ${{ steps.pkg.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
