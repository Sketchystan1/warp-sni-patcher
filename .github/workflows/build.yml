name: Build, test, and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag matching the latest changelog version (blank uses that version)'
        type: string
        required: false
      draft:
        description: 'Create a draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as a prerelease'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and prepare release notes
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
        run: python scripts/prepare_release.py
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.should_release == 'true'
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: windows}
          - {os: ubuntu-latest, platform: linux}
          - {os: macos-15, platform: macos}
          - {os: macos-15-intel, platform: macos-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfltk1.3-dev
      - name: Build and test universal macOS package
        if: runner.os == 'macOS'
        run: python scripts/build_all.py --macos
      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -S . -B .cache/native -DCMAKE_BUILD_TYPE=MinSizeRel
      - name: Build
        if: runner.os != 'macOS'
        run: cmake --build .cache/native --config MinSizeRel --parallel
      - name: Test
        if: runner.os != 'macOS'
        run: ctest --test-dir .cache/native -C MinSizeRel --output-on-failure
      - name: Package
        if: runner.os != 'macOS'
        run: cmake --build .cache/native --config MinSizeRel --target package
      - name: Test installed macOS WARP
        if: runner.os == 'macOS'
        timeout-minutes: 12
        run: python scripts/test_macos.py
      - uses: actions/upload-artifact@v4
        if: matrix.platform != 'macos-intel'
        with:
          name: packages-${{ matrix.platform }}
          path: |
            .cache/native/warp-sni-patcher-*.zip
            .cache/native/warp-sni-patcher-*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.plan.outputs.title }}
          body_path: artifacts/release_notes.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ needs.plan.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
